version: 2.1
orbs:
  ruby: circleci/ruby@4

jobs:
  build:
    docker:
      - image: cimg/ruby:4.0
      - image: cimg/postgres:16.16
    steps:
      - checkout
      - ruby/install-deps
      - run:
          command: bundle exec rake setup:configs
      - run:
          command: bundle exec rake db:migrate
      - run:
          command: bundle exec rspec --format progress --format RspecJunitFormatter -o /tmp/test-results/rspec.xml
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
